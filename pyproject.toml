[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phasesight-validation-kit"
version = "0.1.0"
description = "A reproducible validation harness for camera-based vibration screening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "opencv-python>=4.9",
  "matplotlib>=3.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
phasesight = "phasesight.cli:main"

[tool.setuptools.packages.find]
include = ["phasesight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
